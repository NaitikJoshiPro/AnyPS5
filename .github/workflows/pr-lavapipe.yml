name: PR tests on lavapipe

on:
  push:
    branches: ['ci/**']
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGETS: agc_driver_queue_zero_idle_wait_tests agc_driver_store_idle_results_tests
  TESTS: '^(agc_driver_queue_zero_idle_wait|agc_driver_store_idle_results)$'
  ANYPS5_REQUIRE_VULKAN: 1
  ANYPS5_NO_SHADER_CACHE: 1

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install toolchain, lavapipe and SDL dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-14 gcc-14 ninja-build ccache mesa-vulkan-drivers libvulkan1 vulkan-tools \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxkbcommon-dev libwayland-dev libegl-dev libgl-dev \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev
          ls /usr/share/vulkan/icd.d
          vulkaninfo --summary | sed -n '/Devices:/,$p'
      - run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14
          "-DANYPS5_AGC_EXECUTION_TESTS=QueueZeroIdleWait;StoreIdleResults"
      - run: cmake --build build --parallel 4 --target $TARGETS
      - name: Run the tests with the fix, five times each
        run: ctest --test-dir build --output-on-failure --timeout 120 -R "$TESTS" --repeat until-fail:5 --output-junit ctest.xml
      - run: python3 tools/check_skips.py build/ctest.xml
      - name: Run store idle results in its idle-epoch-wake mode, five times
        run: |
          binary=$(find build -type f -name agc_driver_store_idle_results_tests | head -1)
          for i in 1 2 3 4 5; do "$binary" --idle-epoch-wake; done
      - name: Without the fix, queue_zero_idle_wait must fail
        run: |
          file=core/libs/prx/libSceAgcDriver/Execution/src/Driver/Queues/QueueWorker.cpp
          python3 - "$file" <<'PY'
          import sys
          path = sys.argv[1]
          text = open(path).read()
          fixed = "((!storeIdleResults && Graphics::StorageTexture::AnyPending()) || idleEpoch"
          assert fixed in text
          open(path, "w").write(text.replace(fixed, "(!storeIdleResults || idleEpoch"))
          PY
          git diff --stat
          cmake --build build --parallel 4 --target agc_driver_queue_zero_idle_wait_tests
          if ctest --test-dir build --output-on-failure --timeout 120 -R '^agc_driver_queue_zero_idle_wait$'; then echo "::error::the test passed without the fix"; exit 1; fi
          echo "agc_driver_queue_zero_idle_wait fails without the fix, as expected"
